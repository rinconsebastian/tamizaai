# Serves the Angular build and proxies /api/ to the api service. Only this container publishes a port.

# Keep the scheme the outer HTTPS proxy saw, if there is one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, re-resolved so an api restart with a new address keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 20m;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Preparing a data export reads the whole table into a file before it answers, which can take minutes (the API's own limit
    # is 5 minutes by default). A regex, because the path has the project and table in the middle.
    location ~ ^/api/v1/projects/[^/]+/data/[^/]+/[^/]+/exports$ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 360s;
        client_max_body_size 20m;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The AI assistant waits for the model provider before it answers, which can take minutes (the API's own limit is
    # at most 240 seconds, 120 by default). Request bodies are small: the conversation and the script, never data.
    location ~ ^/api/v1/projects/[^/]+/assistant/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The single-use download link: the file streams straight through instead of being buffered by nginx.
    location ^~ /api/v1/data-exports/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Map tiles relayed by the api (Google basemaps): streamed straight through, never spooled to disk, and kept out of this
    # container's access log, since the link in the address works for up to an hour. ^~ keeps the static-asset rule below away
    # from these paths. The error log still holds the request line when the api is down; operations.md says so.
    location ^~ /api/v1/basemap-tiles/ {
        access_log off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build output can be cached for good.
    location ~* \.(?:js|css|woff2?|ico|png|svg|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Translation files are not fingerprinted, so they must be revalidated. ^~ makes this prefix win over the
    # regex location above, which would otherwise cache en.json as immutable for a year.
    location ^~ /i18n/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: deep links such as /projects load the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
