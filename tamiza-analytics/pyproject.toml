[project]
name = "tamiza"
version = "0.1.0"
description = "Tamiza analytics worker: flattens raw submissions and runs user scripts."
requires-python = "==3.12.*"
# Pinned exactly: user scripts depend on these APIs, so upgrades are deliberate.
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamiza"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
